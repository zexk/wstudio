name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Build and test
        run: nix develop --command zig build check

      - name: Build with runtime safety
        run: nix develop --command zig build -Doptimize=ReleaseSafe

      # Here rather than on Linux: the package links nixpkgs' speexdsp, and
      # nixpkgs cannot cross-build that (or much else) for darwin from Linux.
      - name: Build Nix package
        run: nix build .#macos

  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop --command zig fmt --check build.zig src tools

      - name: Build and test
        run: nix develop --command zig build check

      - name: Build with runtime safety
        run: nix develop --command zig build -Doptimize=ReleaseSafe

      - name: Cross-build Windows
        run: nix develop --command zig build -Dtarget=x86_64-windows-gnu

      - name: Build Nix packages
        run: nix build .#default .#windows
