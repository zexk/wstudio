name: Release

on:
  push:
    tags:
      - "v*"
  # Lets a tag that already has a release get missing assets uploaded
  # without deleting and re-pushing it. Dispatch from the default branch so
  # this file is the one that runs, and name the tag to build:
  #   gh workflow run release.yml -f tag=v1.0.0-beta.4
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload assets for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Every dependency comes from the flake's devShell, including the mingw
      # copies the Windows cross-build links against, so there is no apt list
      # to keep in step with build.zig.
      - uses: cachix/install-nix-action@v31

      - name: Build Linux release
        run: nix develop --command zig build -Doptimize=ReleaseSafe

      - name: Package Linux release
        run: |
          mkdir -p dist/wstudio-linux-x86_64/examples
          cp zig-out/bin/wstudio demo.wsj README.md CHANGELOG.md FORMAT.md LICENSE THIRD_PARTY_LICENSES.md dist/wstudio-linux-x86_64/
          cp -R docs dist/wstudio-linux-x86_64/
          cp examples/init.lua dist/wstudio-linux-x86_64/examples/
          tar -C dist -czf dist/wstudio-linux-x86_64.tar.gz wstudio-linux-x86_64

      - name: Verify Linux release
        run: |
          release_dir=$(mktemp -d)
          tar -C "$release_dir" -xzf dist/wstudio-linux-x86_64.tar.gz
          cd "$release_dir/wstudio-linux-x86_64"
          test -x wstudio
          test -f docs/lua-api.md
          test -f examples/init.lua
          nix develop "$GITHUB_WORKSPACE" --command bash -c '
            ./wstudio --version | grep -Fx "wstudio ${TAG#v}"
            ./wstudio render demo.wsj master.wav
          '
          file master.wav | grep -F "stereo 48000 Hz"

      - name: Build and package Windows releases
        run: |
          set -euo pipefail
          package_windows() {
            arch=$1
            shell=$2
            target=$3
            objdump=$4
            dir="dist/wstudio-windows-$arch"
            nix develop "$shell" --command zig build -Doptimize=ReleaseSafe -Dtarget="$target"
            mkdir -p "$dir/examples"
            cp zig-out/bin/wstudio.exe zig-out/bin/wstudio-plugin-bridge.exe \
              demo.wsj README.md CHANGELOG.md FORMAT.md LICENSE THIRD_PARTY_LICENSES.md "$dir/"
            WSTUDIO_ARCH="$arch" WSTUDIO_RELEASE_DIR="$dir" WSTUDIO_OBJDUMP="$objdump" \
              nix develop "$shell" --command bash -c '
              set -eu
              # mingw libsndfile has a transitive codec DLL closure. Walk it
              # because sonames vary, and copy each file by imported name.
              queue=$($WSTUDIO_OBJDUMP -p zig-out/bin/wstudio.exe | sed -n "s/^[[:space:]]*[Dd][Ll][Ll] [Nn]ame: //p")
              copied=""
              while [ -n "$queue" ]; do
                next=""
                for dll in $queue; do
                  case " $copied " in *" $dll "*) continue;; esac
                  src="$WSTUDIO_TARGET_PREFIX/bin/$dll"
                  [ -f "$src" ] || src="$WSTUDIO_TARGET_PREFIX/bin/lib$dll"
                  [ -f "$src" ] || continue
                  cp "$src" "$WSTUDIO_RELEASE_DIR/$dll"
                  copied="$copied $dll"
                  next="$next $($WSTUDIO_OBJDUMP -p "$src" | sed -n "s/^[[:space:]]*[Dd][Ll][Ll] [Nn]ame: //p")"
                done
                queue="$next"
              done
              if [ "$WSTUDIO_ARCH" = x86_64 ]; then
                test -f "$WSTUDIO_RELEASE_DIR/libsndfile-1.dll"
              fi
            '
            cp -R docs "$dir/"
            cp examples/init.lua "$dir/examples/"
            (cd dist && zip -r "wstudio-windows-$arch.zip" "wstudio-windows-$arch")
            unzip -t "dist/wstudio-windows-$arch.zip"
          }
          package_windows x86_64 . x86_64-windows-gnu objdump
          package_windows arm64 .#windows-arm64 aarch64-w64-mingw32-objdump

      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/wstudio-linux-x86_64.tar.gz
            dist/wstudio-windows-*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: cachix/install-nix-action@v31

      # macos-latest is Apple Silicon, so arm64 is the native build and the
      # Intel one cross-compiles beside it. Zig only auto-detects an SDK for
      # the native case, so the cross build is handed Xcode's explicitly, and
      # the devShell hands it Intel copies of the C libraries through
      # WSTUDIO_TARGET_PREFIX.
      - name: Build and package macOS releases
        run: |
          set -euo pipefail
          # A dylib from nix is referenced by its absolute /nix/store path,
          # which does not exist on a user's Mac, so every non-system library
          # in the closure is copied into the bundle and each reference to it
          # repointed at @executable_path. UNVERIFIED on a real runner: it was
          # written on Linux, where otool/install_name_tool do not exist.
          bundle_dylibs() {
            app="$1"
            mkdir -p "$app/Frameworks"
            queue=$(otool -L "$app/MacOS/wstudio" | awk '/\/nix\/store/ {print $1}')
            copied=""
            while [ -n "$queue" ]; do
              next=""
              for dep in $queue; do
                case " $copied " in *" $dep "*) continue;; esac
                base=$(basename "$dep")
                cp -f "$dep" "$app/Frameworks/$base"
                chmod u+w "$app/Frameworks/$base"
                install_name_tool -id "@executable_path/../Frameworks/$base" "$app/Frameworks/$base"
                copied="$copied $dep"
                next="$next $(otool -L "$dep" | awk '/\/nix\/store/ {print $1}')"
              done
              queue="$next"
            done
            for dep in $copied; do
              base=$(basename "$dep")
              install_name_tool -change "$dep" "@executable_path/../Frameworks/$base" "$app/MacOS/wstudio"
              for lib in "$app/Frameworks"/*.dylib; do
                install_name_tool -change "$dep" "@executable_path/../Frameworks/$base" "$lib"
              done
            done
            # Nothing may still point into the store, or it works here and
            # nowhere else.
            ! otool -L "$app/MacOS/wstudio" "$app/Frameworks"/*.dylib | grep -q /nix/store
          }
          package() {
            version=${TAG#v}
            build_version=${version%%-*}
            app="dist/$1/wstudio.app/Contents"
            iconset=$(mktemp -d)/wstudio.iconset
            mkdir -p "$app/MacOS" "$app/Resources" "$iconset" "dist/$1/examples"
            cp zig-out/bin/wstudio "$app/MacOS/"
            bundle_dylibs "$app"
            sed -e "s/@VERSION@/$version/g" -e "s/@BUILD_VERSION@/$build_version/g" \
              assets/macos/Info.plist > "$app/Info.plist"
            cp assets/icon/hicolor/16x16/apps/wstudio.png "$iconset/icon_16x16.png"
            cp assets/icon/hicolor/32x32/apps/wstudio.png "$iconset/icon_16x16@2x.png"
            cp assets/icon/hicolor/32x32/apps/wstudio.png "$iconset/icon_32x32.png"
            cp assets/icon/hicolor/64x64/apps/wstudio.png "$iconset/icon_32x32@2x.png"
            cp assets/icon/hicolor/128x128/apps/wstudio.png "$iconset/icon_128x128.png"
            cp assets/icon/hicolor/256x256/apps/wstudio.png "$iconset/icon_128x128@2x.png"
            cp assets/icon/hicolor/256x256/apps/wstudio.png "$iconset/icon_256x256.png"
            cp assets/icon/hicolor/512x512/apps/wstudio.png "$iconset/icon_256x256@2x.png"
            cp assets/icon/hicolor/512x512/apps/wstudio.png "$iconset/icon_512x512.png"
            cp assets/icon/wstudio-1024.png "$iconset/icon_512x512@2x.png"
            iconutil -c icns "$iconset" -o "$app/Resources/wstudio.icns"
            ln -s wstudio.app/Contents/MacOS/wstudio "dist/$1/wstudio"
            cp demo.wsj README.md CHANGELOG.md FORMAT.md LICENSE THIRD_PARTY_LICENSES.md "dist/$1/"
            cp -R docs "dist/$1/"
            cp examples/init.lua "dist/$1/examples/"
            tar -C dist -czf "dist/$1.tar.gz" "$1"
          }
          nix develop --command zig build -Doptimize=ReleaseSafe
          package wstudio-macos-arm64
          release_dir=$(mktemp -d)
          tar -C "$release_dir" -xzf dist/wstudio-macos-arm64.tar.gz
          cd "$release_dir/wstudio-macos-arm64"
          test -x wstudio
          test -x wstudio.app/Contents/MacOS/wstudio
          test -f wstudio.app/Contents/Resources/wstudio.icns
          plutil -lint wstudio.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' wstudio.app/Contents/Info.plist)" = "${TAG#v}"
          test -f docs/lua-api.md
          test -f examples/init.lua
          nix develop "$GITHUB_WORKSPACE" --command bash -c '
            ./wstudio --version | grep -Fx "wstudio ${TAG#v}"
            ./wstudio render demo.wsj master.wav
          '
          file master.wav | grep -F "stereo 48000 Hz"
          cd "$GITHUB_WORKSPACE"
          SDKROOT="$(xcrun --show-sdk-path)" \
            nix develop --command zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos
          package wstudio-macos-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/wstudio-macos-*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [linux-windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every archive
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Creating fails when the tag already has a release, which is the
        # re-run case: upload the assets into it instead, leaving whatever
        # release notes are already there alone.
        run: |
          gh release create "$TAG" \
            dist/wstudio-*.tar.gz \
            dist/wstudio-*.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --prerelease \
            --title "wstudio ${TAG#v}" \
          || gh release upload "$TAG" \
            dist/wstudio-*.tar.gz \
            dist/wstudio-*.zip \
            dist/SHA256SUMS \
            --clobber
