name: Release

on:
  push:
    tags:
      - "v*"
  # Lets a tag that already has a release get missing assets uploaded
  # without deleting and re-pushing it. Dispatch from the default branch so
  # this file is the one that runs, and name the tag to build:
  #   gh workflow run release.yml -f tag=v1.0.0-beta.4
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload assets for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update && sudo apt-get install --yes \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev

      - name: Build Linux release
        run: zig build -Doptimize=ReleaseSafe

      - name: Package Linux release
        run: |
          mkdir -p dist/wstudio-linux-x86_64
          cp zig-out/bin/wstudio demo.wsj README.md CHANGELOG.md LICENSE dist/wstudio-linux-x86_64/
          tar -C dist -czf dist/wstudio-linux-x86_64.tar.gz wstudio-linux-x86_64

      - name: Build Windows release
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu

      - name: Package Windows release
        run: |
          mkdir -p dist/wstudio-windows-x86_64
          cp zig-out/bin/wstudio.exe demo.wsj README.md CHANGELOG.md LICENSE dist/wstudio-windows-x86_64/
          cd dist
          zip -r wstudio-windows-x86_64.zip wstudio-windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/wstudio-linux-x86_64.tar.gz
            dist/wstudio-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: cachix/install-nix-action@v31

      # Native build only, no -Dtarget: an explicit target puts zig in
      # cross-compile mode, where it stops picking up the system Xcode SDK
      # and the nix apple-sdk's Security.framework headers fail on a
      # missing libDER. That leaves Intel Macs uncovered for now.
      - name: Build and package macOS release
        run: |
          set -euo pipefail
          nix develop --command zig build -Doptimize=ReleaseSafe
          mkdir -p dist/wstudio-macos-arm64
          cp zig-out/bin/wstudio demo.wsj README.md CHANGELOG.md LICENSE dist/wstudio-macos-arm64/
          tar -C dist -czf dist/wstudio-macos-arm64.tar.gz wstudio-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/wstudio-macos-arm64.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [linux-windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every archive
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Creating fails when the tag already has a release, which is the
        # re-run case: upload the assets into it instead, leaving whatever
        # release notes are already there alone.
        run: |
          gh release create "$TAG" \
            dist/wstudio-*.tar.gz \
            dist/wstudio-*.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --prerelease \
            --title "wstudio ${TAG#v}" \
          || gh release upload "$TAG" \
            dist/wstudio-*.tar.gz \
            dist/wstudio-*.zip \
            dist/SHA256SUMS \
            --clobber
